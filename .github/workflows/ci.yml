name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash -l {0}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch current PR labels
        id: fetch-labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const eventName = context.eventName;
            let labels = new Array();
            // For schedule jobs, add all roles to tests by fetching all possible labels
            const allLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo }
            );

            for (const label of allLabels) {
              core.info(label.name);
              if (label.name.startsWith("roles/")) {
                labels.push(label);
              }
            }
            core.info(labels);
            const names = labels.map(l => l.name);
            core.info(names);
            core.info(`Current labels: ${names.join(', ') || '(none)'}`);
            core.setOutput('names', JSON.stringify(names));

      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.fetch-labels.outcome }}" == "success" ]; then
            COLOR=5763719
            STATUS="Success"
            EMOJI=":white_check_mark:"
          else
            COLOR=15548997
            STATUS="Failed"
            EMOJI=":x:"
          fi
          
          curl -H "Content-Type: application/json" \
               -d "{
                 \"embeds\": [{
                   \"title\": \"$EMOJI Update Python Offsets Scheduled Pipeline - $STATUS\",
                   \"description\": \"Updating Python offsets for ebpf package in \`${{ github.repository }}\`\",
                   \"color\": $COLOR,
                   \"fields\": [
                     {\"name\": \"Branch\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                     {\"name\": \"Commit\", \"value\": \"\`${{ github.sha }}\`\", \"inline\": true},
                     {\"name\": \"Author\", \"value\": \"${{ github.actor }}\", \"inline\": true}
                   ],
                   \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                 }]
               }" \
               $DISCORD_WEBHOOK
